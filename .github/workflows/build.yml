name: Build Plugin DLLs

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows you to manually click "Run workflow" in GitHub

jobs:
  build:
    runs-on: windows-latest

    strategy:
      matrix:
        arch: [Win32, x64] # Builds 32-bit (Portal 2, L4D2, CSS) and 64-bit (TF2)

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Configure CMake
      run: cmake -B build -A ${{ matrix.arch }}

    - name: Build Release DLL
      run: cmake --build build --config Release

    - name: Upload DLL Artifact
      uses: actions/upload-artifact@v4
      with:
        name: cvardumper-${{ matrix.arch }}
        path: build/Release/cvardumper.dll
